  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden;
      position: fixed; inset: 0; overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: none; }
    #game { position: absolute; inset: 0; box-sizing: border-box; background: #000;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    canvas { touch-action: none; }
    #rotate { display: none; position: fixed; inset: 0; background: #0a0818; color: #ffd84a; z-index: 10;
      font: bold 22px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
    #rotate .phone { width: 46px; height: 80px; border: 4px solid #ffd84a; border-radius: 8px; animation: turn 1.6s ease-in-out infinite; }
    #rotate small { color: #aab4c8; font-size: 13px; font-weight: normal; }
    @keyframes turn { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse), (orientation: portrait) and (hover: none) { #rotate { display: flex; } }
  </style>
